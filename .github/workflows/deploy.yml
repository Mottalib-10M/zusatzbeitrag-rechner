name: Kassenliste lesen, bauen, veröffentlichen

# Läuft bei jedem Push und jeden Morgen: liest die Liste der Zusatzbeitragssätze des
# GKV-Spitzenverbands (§ 242 Abs. 5 SGB V), schreibt Änderungen mit Datum in die Historie,
# testet, baut und veröffentlicht. Keine Zugangsdaten nötig: die Liste ist öffentlich.
on:
  push:
    branches: ['main']
  schedule:
    - cron: '20 4 * * *'   # 06:20 Uhr deutscher Sommerzeit, nach dem Tageswechsel der Liste
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kassenliste abrufen
        id: liste
        # Schlägt der Abruf fehl (Seite umgebaut, Liste unvollständig), bleibt die letzte Liste stehen.
        continue-on-error: true
        run: python3 scripts/fetch-kassen.py
      - name: Geänderte Kassenliste committen
        if: steps.liste.outcome == 'success'
        run: |
          if ! git diff --quiet -- src/data/kassen.json src/data/kassen-historie.json; then
            git config user.name "zusatzbeitragrechner-bot"
            git config user.email "contact@zusatzbeitragrechner.de"
            git add src/data/kassen.json src/data/kassen-historie.json src/data/kassen-abruf.json
            git commit -m "Kassenliste: neue Sätze laut GKV-Spitzenverband ($(date -u +%F))"
            git push
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Tests des Rechners
        run: npx vitest run
      - name: Build (mit Kontrolle der Titel und Beschreibungen)
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Checkout (für IndexNow)
        if: github.event_name == 'push'
        uses: actions/checkout@v4
      - name: IndexNow anpingen
        if: github.event_name == 'push'
        continue-on-error: true
        run: bash scripts/indexnow.sh https://zusatzbeitragrechner.de
